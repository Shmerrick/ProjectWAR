name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore test/LobbyServer.Tests/LobbyServer.Tests.csproj
    
    - name: Build
      run: dotnet build test/LobbyServer.Tests/LobbyServer.Tests.csproj --no-restore
    
    - name: Test
      run: dotnet test test/LobbyServer.Tests/LobbyServer.Tests.csproj --no-build --verbosity normal
