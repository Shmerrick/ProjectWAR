name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build Core Projects
      run: |
        dotnet build src/Common/Common.csproj --no-restore
        dotnet build src/FrameWork/FrameWork.csproj --no-restore
        dotnet build src/RpcSourceGenerator/RpcSourceGenerator.csproj --no-restore
        dotnet build src/LauncherServer.Dtos/LauncherServer.Dtos.csproj --no-restore
        dotnet build src/AccountCacher/AccountCacher.csproj --no-restore
        dotnet build src/LauncherServer/LauncherServer.csproj --no-restore
        dotnet build src/LobbyServer/LobbyServer.csproj --no-restore
        dotnet build src/WorldServer/WorldServer.csproj --no-restore
        dotnet build src/ServerLauncher/ServerLauncher.csproj --no-restore
    
    - name: Build and Test
      run: |
        for project in test/**/*.csproj; do
          dotnet build "$project" --no-restore
        done
        for project in test/**/*.csproj; do
          dotnet test "$project" --no-build --verbosity normal
        done
