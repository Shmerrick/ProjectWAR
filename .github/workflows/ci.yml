name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build Core Projects
      run: |
        dotnet build Common/Common.csproj --no-restore
        dotnet build FrameWork/FrameWork.csproj --no-restore
        dotnet build RpcSourceGenerator/RpcSourceGenerator.csproj --no-restore
        dotnet build LauncherServer.Dtos/LauncherServer.Dtos.csproj --no-restore
        dotnet build AccountCacher/AccountCacher.csproj --no-restore
        dotnet build LauncherServer/LauncherServer.csproj --no-restore
        dotnet build LobbyServer/LobbyServer.csproj --no-restore
        dotnet build WorldServer/WorldServer.csproj --no-restore
        dotnet build ServerLauncher/ServerLauncher.csproj --no-restore
    
    - name: Build Tests
      run: dotnet build test/LobbyServer.Tests/LobbyServer.Tests.csproj --no-restore
    
    - name: Test
      run: dotnet test test/**/*.csproj --no-build --verbosity normal
